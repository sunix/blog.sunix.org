<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

{% include head.html %}

<body class="font-sans text-slate-900 dark:text-slate-100 bg-slate-50 dark:bg-slate-950">

<!-- Background decor -->
<div class="pointer-events-none fixed inset-0 -z-10">
  <div class="absolute inset-0 opacity-70 dark:opacity-50 noise"></div>
  <div class="absolute -top-40 left-1/2 h-[520px] w-[520px] -translate-x-1/2 rounded-full blur-3xl
              bg-gradient-to-br from-fuchsia-500/50 via-cyan-400/45 to-amber-400/45 dark:from-fuchsia-500/30 dark:via-cyan-400/25 dark:to-amber-400/20 animate-pulse" style="animation-duration: 4s;"></div>
  <div class="absolute -bottom-48 right-[-120px] h-[420px] w-[420px] rounded-full blur-3xl
              bg-gradient-to-br from-emerald-400/40 via-violet-500/35 to-sky-400/35 dark:from-emerald-400/20 dark:via-violet-500/18 dark:to-sky-400/15 animate-pulse" style="animation-duration: 5s; animation-delay: 1s;"></div>
  <div class="absolute top-1/3 -left-20 h-[380px] w-[380px] rounded-full blur-3xl
              bg-gradient-to-br from-pink-500/35 via-purple-500/30 to-indigo-400/30 dark:from-pink-500/15 dark:via-purple-500/12 dark:to-indigo-400/10 animate-pulse" style="animation-duration: 6s; animation-delay: 2s;"></div>
</div>

{% include header.html %}

<main class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8 min-h-screen">
  <div class="py-10">
    {{ content }}
  </div>
</main>

{% include footer.html %}

</body>

</html>
