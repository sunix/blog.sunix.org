---
layout: default
---
<div class="post mt-10">

  <header class="mb-8">
    <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight leading-tight">{{ page.title }}</h1>
  </header>

  <article class="post-content prose prose-slate dark:prose-invert max-w-none
              prose-headings:font-extrabold prose-headings:tracking-tight
              prose-a:text-cyan-600 dark:prose-a:text-cyan-400 prose-a:no-underline hover:prose-a:underline
              prose-code:text-fuchsia-600 dark:prose-code:text-fuchsia-400 prose-code:font-mono
              prose-pre:bg-slate-950 prose-pre:text-slate-100 prose-pre:border prose-pre:border-white/10 prose-pre:rounded-2xl
              prose-img:rounded-2xl prose-img:shadow-glow"> 
    {{ content }}
  </article>

  {% if page.comments %}
  {% include comments.html %}
  {% endif %}

</div>
