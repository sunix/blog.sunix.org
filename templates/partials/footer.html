  <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8 py-10">
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6">
      <div>
        <div class="font-extrabold">\{ blog.sunix.org }</div>
        <div class="mt-1 text-sm text-slate-600 dark:text-slate-400">
          © <span id="year"></span> — Java Devops AI and FOSS
        </div>
      </div>
      <div class="flex flex-wrap gap-3 text-sm font-semibold text-slate-700 dark:text-slate-300">
        <a class="hover:text-slate-900 dark:hover:text-white" href="/feed.xml">RSS</a>

<script>
  // Dark mode toggle
  const toggle = document.getElementById("themeToggle");
  const root = document.documentElement;

  // Initialize theme
  const saved = localStorage.getItem("theme");
  if (saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
    root.classList.add("dark");
  }

  toggle?.addEventListener("click", () => {
    root.classList.toggle("dark");
    localStorage.setItem("theme", root.classList.contains("dark") ? "dark" : "light");
  });

  // Mobile menu toggle
  const mobileMenuToggle = document.getElementById("mobileMenuToggle");
  const mobileMenu = document.getElementById("mobileMenu");

  if (mobileMenuToggle && mobileMenu) {
    mobileMenuToggle.addEventListener("click", () => {
      const isHidden = mobileMenu.classList.contains("hidden");
      if (isHidden) {
        mobileMenu.classList.remove("hidden");
        mobileMenuToggle.setAttribute("aria-expanded", "true");
      } else {
        mobileMenu.classList.add("hidden");
        mobileMenuToggle.setAttribute("aria-expanded", "false");
      }
    });
  }

  // Desktop CV submenu hover
  const cvMenuContainers = document.querySelectorAll(".cv-menu-container");
  cvMenuContainers.forEach(container => {
    const submenu = container.querySelector(".cv-submenu");
    if (submenu) {
      container.addEventListener("mouseenter", () => {
        submenu.classList.remove("hidden");
      });
      container.addEventListener("mouseleave", () => {
        submenu.classList.add("hidden");
      });
    }
  });

  // Mobile CV submenu toggle
  const cvMobileToggle = document.querySelector(".cv-mobile-menu-toggle");
  const cvMobileSubmenu = document.getElementById("cv-mobile-submenu");
  const cvMobileArrow = document.querySelector(".cv-mobile-arrow");

  if (cvMobileToggle && cvMobileSubmenu) {
    const toggleSubmenu = () => {
      const isHidden = cvMobileSubmenu.classList.contains("hidden");
      if (isHidden) {
        cvMobileSubmenu.classList.remove("hidden");
        cvMobileToggle.setAttribute("aria-expanded", "true");
        if (cvMobileArrow) cvMobileArrow.textContent = "▲";
      } else {
        cvMobileSubmenu.classList.add("hidden");
        cvMobileToggle.setAttribute("aria-expanded", "false");
        if (cvMobileArrow) cvMobileArrow.textContent = "▼";
      }
    };

    cvMobileToggle.addEventListener("click", toggleSubmenu);
    // Handle keyboard events for accessibility (Enter and Space keys)
    // Prevent default for Space to avoid page scrolling
    cvMobileToggle.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        toggleSubmenu();
      }
    });
  }

  // Update year
  document.getElementById("year").textContent = new Date().getFullYear();
</script>
