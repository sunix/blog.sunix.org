<article class="rounded-[24px] border border-white/40 dark:border-white/10 bg-white/70 dark:bg-white/5 backdrop-blur p-6 sm:p-8 shadow-sm hover:shadow-[0_0_40px_rgba(139,92,246,0.3),0_0_20px_rgba(34,211,238,0.2)] hover:border-fuchsia-400/50 dark:hover:border-fuchsia-500/30 transition-all duration-300">
  <!-- Tags at the top -->
  <div class="flex flex-wrap gap-2 mb-4">
    {#if post.data.category}
    <a href="/archives#{post.data.category.encodeForHash}" class="post-category-link text-xs font-bold rounded-full px-3 py-1 bg-cyan-200/70 text-cyan-900 dark:bg-cyan-300/20 dark:text-cyan-200 border border-cyan-300/40 dark:border-cyan-300/20 hover:bg-cyan-300/90 transition">
      {post.data.category}
    </a>
    {/if}
    {#if post.data.tags}
    {#for tag in post.data.tags}
    <a href="/tags#{tag}" class="text-xs font-bold rounded-full px-3 py-1 bg-purple-200/70 text-purple-900 dark:bg-purple-300/20 dark:text-purple-200 border border-purple-300/40 dark:border-purple-300/20 hover:bg-purple-300/90 transition">
      {tag}
    </a>
    {/for}
    {/if}
  </div>

  <!-- Title -->
  <h3 class="text-xl sm:text-2xl font-extrabold tracking-tight leading-snug mb-3">
    <a href="{post.url}" class="hover:text-transparent hover:bg-clip-text hover:bg-gradient-to-r hover:from-cyan-500 hover:to-purple-500 transition">{post.title}</a>
  </h3>

  <!-- Excerpt -->
  {#if post.excerpt()}
  <p class="mt-3 text-slate-700 dark:text-slate-300 leading-relaxed">
    {post.excerpt()}
  </p>
  {/if}

  <!-- Date -->
  <div class="mt-4">
    <time class="text-sm font-semibold text-slate-600 dark:text-slate-400" datetime="{post.date}">
      {post.date.format('MMM dd, yyyy')}
    </time>
  </div>

  <!-- Read More button -->
  <div class="mt-3">
    <a
      href="{post.url}"
      class="inline-flex items-center gap-1 px-4 py-2 text-sm font-semibold rounded-xl bg-gradient-to-r from-purple-400 via-pink-400 to-orange-400 text-white hover:from-purple-500 hover:via-pink-500 hover:to-orange-500 shadow-md hover:shadow-lg transition-all"
    >
      Read more <span>→</span>
    </a>
  </div>
</article>
