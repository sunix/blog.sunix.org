<header class="sticky top-0 z-50">
  <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
    <div class="mt-4 rounded-2xl border border-white/30 dark:border-white/10 bg-white/70 dark:bg-slate-950/60 backdrop-blur shadow-sm">
      <div class="flex items-center justify-between px-4 sm:px-6 py-3">
        <a href="/" class="flex items-center gap-3">
          <span class="inline-flex h-9 w-9 items-center justify-center rounded-xl
                       bg-gradient-to-br from-cyan-400 via-purple-400 to-pink-400 text-white shadow-lg hover:shadow-[0_0_20px_rgba(34,211,238,0.6)] transition-all duration-300">
            <span class="font-extrabold">S</span>
          </span>
          <span class="font-extrabold tracking-tight text-lg">\{ blog.sunix.org }</span>
          <span class="hidden sm:inline text-xs font-medium text-slate-600 dark:text-slate-400">
            Java Devops AI and FOSS
          </span>
        </a>

        <nav class="hidden md:flex items-center gap-6 text-sm font-semibold text-slate-700 dark:text-slate-300">
          <a class="hover:text-slate-900 dark:hover:text-white" href="/archives">Articles</a>
          <a class="hover:text-slate-900 dark:hover:text-white" href="/about">About</a>
          <div class="relative cv-menu-container">
            <a class="hover:text-slate-900 dark:hover:text-white cursor-pointer" href="/cv">CV</a>
            <div class="cv-submenu absolute left-0 top-full mt-2 hidden w-56 rounded-xl border border-white/30 dark:border-white/10 bg-white/95 dark:bg-slate-950/95 backdrop-blur shadow-lg py-2 z-50">
              <a class="block px-4 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg mx-2" href="/cv#experience">Experience</a>
              <a class="block px-4 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg mx-2" href="/cv#community-involvement">Community Involvement</a>
              <a class="block px-4 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg mx-2" href="/cv#conferences-talks">Conferences &amp; Talks</a>
            </div>
          </div>
        </nav>

        <div class="flex items-center gap-2">
          <button
            id="themeToggle"
            class="inline-flex items-center justify-center rounded-xl border border-slate-200 dark:border-white/10
                   bg-white/80 dark:bg-white/5 px-3 py-2 text-sm font-semibold hover:bg-white transition"
            aria-label="Toggle dark mode"
            type="button"
          >
            <span class="dark:hidden">🌙</span>
            <span class="hidden dark:inline">☀️</span>
          </button>

          <button
            id="mobileMenuToggle"
            class="md:hidden inline-flex items-center justify-center rounded-xl px-3 py-2 border border-slate-200 dark:border-white/10 bg-white/80 dark:bg-white/5 hover:bg-white transition"
            aria-label="Toggle mobile menu"
            aria-expanded="false"
            type="button"
          >
            ☰
          </button>
        </div>
      </div>

      <!-- Mobile menu -->
      <div id="mobileMenu" class="hidden md:hidden px-4 sm:px-6 pb-4">
        <nav class="flex flex-col gap-3 text-sm font-semibold text-slate-700 dark:text-slate-300">
          <a class="hover:text-slate-900 dark:hover:text-white py-2 border-b border-slate-200 dark:border-white/10" href="/archives">Articles</a>
          <a class="hover:text-slate-900 dark:hover:text-white py-2 border-b border-slate-200 dark:border-white/10" href="/about">About</a>
          <div class="py-2 border-b border-slate-200 dark:border-white/10">
            <div class="cv-mobile-menu-toggle hover:text-slate-900 dark:hover:text-white cursor-pointer flex justify-between items-center">
              <span>CV</span>
              <span class="cv-mobile-arrow text-xs">▼</span>
            </div>
            <div class="cv-mobile-submenu hidden mt-2 ml-4 space-y-2">
              <a class="block hover:text-slate-900 dark:hover:text-white text-xs py-1" href="/cv#experience">Experience</a>
              <a class="block hover:text-slate-900 dark:hover:text-white text-xs py-1" href="/cv#community-involvement">Community Involvement</a>
              <a class="block hover:text-slate-900 dark:hover:text-white text-xs py-1" href="/cv#conferences-talks">Conferences &amp; Talks</a>
            </div>
          </div>
        </nav>
      </div>
    </div>
  </div>
</header>
