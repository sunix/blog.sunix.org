<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta property="og:title" content="\{ {title ?: site.title} }">
<title>\{ {title ?: site.title} }</title>
<meta property="og:description" content="{description ?: site.description}">
<meta property="og:url" content="{page.url.absolute}">
<meta property="og:site_name" content="\{ {site.title} }">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary">
<meta name="twitter:site" content="@__sunix_">
<meta name="twitter:creator" content="@__sunix_">
<meta name="twitter:title" content="\{ {title ?: site.title} }">
<meta name="twitter:description" content="{description ?: site.description}">
<meta name="twitter:url" content="{page.url.absolute}">

<meta property="og:type" content="website">
<meta property="og:image" content="{site.url}/assets/hero-illustration.webp">
<meta name="twitter:image" content="{site.url}/assets/hero-illustration.webp">

<meta name="keywords" content="sunix, Java, Cloud, Software Development, FOSS, Open Source, Eclipse JKube, Fabric8 Kubernetes Java Client, Eclipse Che, Eclipse Theia, ParisJUG, Devoxx France, Java Community, Java Champion">

<link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
<link rel="alternate icon" href="/images/favicon.ico">
<link rel="canonical" href="{page.url.absolute}">
<link rel="alternate" type="application/atom+xml" title="\{ {site.title} }" href="{site.url}/feed.xml" />

{#bundle key="app" tag="style" /}

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<script src="https://cdn.mathjax.org/mathjax/latest/MathJax.js?config=TeX-AMS-MML_HTMLorMML"></script>
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  document.querySelectorAll('pre > code.language-mermaid').forEach(el => {
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = el.textContent;
    el.parentElement.replaceWith(div);
  });
  mermaid.initialize({ startOnLoad: true, theme: 'default' });
</script>
</head>

<body class="font-sans text-slate-900 dark:text-slate-100 bg-slate-50 dark:bg-slate-950">

<!-- Background decor -->
<div class="pointer-events-none fixed inset-0 -z-10">
  <div class="absolute inset-0 opacity-70 dark:opacity-50 noise"></div>
  <div class="absolute -top-40 left-1/2 h-[520px] w-[520px] -translate-x-1/2 rounded-full blur-3xl
              bg-gradient-to-br from-fuchsia-400/30 via-cyan-300/25 to-amber-300/25 dark:from-fuchsia-500/18 dark:via-cyan-400/14 dark:to-amber-300/12"></div>
  <div class="absolute -bottom-48 right-[-120px] h-[420px] w-[420px] rounded-full blur-3xl
              bg-gradient-to-br from-emerald-400/25 via-violet-400/20 to-sky-300/20 dark:from-emerald-400/12 dark:via-violet-400/12 dark:to-sky-300/10"></div>
</div>

{#include partials/header.html /}

<main class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8 min-h-screen">
  <div class="py-10">
    {#insert /}
  </div>
</main>

{#include partials/footer.html /}

</body>

</html>
