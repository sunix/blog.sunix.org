---
layout: main
title: Archives - All Articles
---

<div class="mb-8">
  <h1 class="text-4xl font-extrabold tracking-tight mb-3">All Articles</h1>
  <p class="text-slate-700 dark:text-slate-300">Browse all blog posts chronologically</p>
</div>

<div id="active-category-filter" class="mb-6 hidden">
  <div class="inline-flex items-center gap-2 rounded-full border border-cyan-300/40 dark:border-cyan-300/20 bg-cyan-200/70 dark:bg-cyan-300/20 px-4 py-2">
    <span class="text-sm font-semibold text-cyan-900 dark:text-cyan-200">Filtering by:</span>
    <span id="current-category" class="text-sm font-bold text-cyan-900 dark:text-cyan-200"></span>
    <a href="/archives" class="ml-2 text-cyan-900 dark:text-cyan-200 hover:text-cyan-700 dark:hover:text-cyan-100 transition">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </a>
  </div>
</div>

<div id="posts-container" class="space-y-8">
  {#for post in site.collections.posts}
  <div class="post-item">
    {#include partials/article-card.html /}
  </div>
  {/for}
</div>

<div id="no-results" class="hidden text-center py-12">
  <div class="text-slate-600 dark:text-slate-400">
    <svg class="w-16 h-16 mx-auto mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <p class="text-lg font-semibold">No posts found in this category</p>
    <a href="/archives" class="mt-4 inline-block text-cyan-600 dark:text-cyan-400 hover:underline">View all articles</a>
  </div>
</div>

<script>
  (function() {
  const postsContainer = document.getElementById('posts-container');
    const noResults = document.getElementById('no-results');
    const activeCategoryFilter = document.getElementById('active-category-filter');
    const currentCategorySpan = document.getElementById('current-category');

    function readSelectedCategory() {
      const hash = window.location.hash.substring(1);
      if (!hash) {
        return '';
      }
      try {
        return decodeURIComponent(hash);
      } catch (error) {
        return hash;
      }
    }

    function filterByCategory() {
      const selectedCategory = readSelectedCategory();
      const posts = postsContainer.querySelectorAll('.post-item');

      if (!selectedCategory) {
        posts.forEach(post => post.style.display = '');
        noResults.classList.add('hidden');
        activeCategoryFilter.classList.add('hidden');
        return;
      }

      currentCategorySpan.textContent = selectedCategory;
      activeCategoryFilter.classList.remove('hidden');

      let visibleCount = 0;
      posts.forEach(post => {
        const categoryLink = post.querySelector('.post-category-link');
        const category = categoryLink ? categoryLink.textContent.trim() : '';
        if (category === selectedCategory) {
          post.style.display = '';
          visibleCount++;
        } else {
          post.style.display = 'none';
        }
      });

      if (visibleCount === 0) {
        noResults.classList.remove('hidden');
      } else {
        noResults.classList.add('hidden');
      }
    }

    window.addEventListener('hashchange', filterByCategory);
    filterByCategory();
  })();
</script>
