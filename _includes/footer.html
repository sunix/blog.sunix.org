<footer class="border-t border-white/30 dark:border-white/10 bg-white/40 dark:bg-white/5 backdrop-blur">
  <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8 py-10">
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6">
      <div>
        <div class="font-extrabold">{{ site.title }}</div>
        <div class="mt-1 text-sm text-slate-600 dark:text-slate-400">
          © <span id="year"></span> — {{ site.tagline }}
        </div>
      </div>
      <div class="flex flex-wrap gap-3 text-sm font-semibold text-slate-700 dark:text-slate-300">
        <a class="hover:text-slate-900 dark:hover:text-white" href="{{ "/feed.xml" | prepend: site.baseurl }}">RSS</a>
        {% if site.github_username %}
        <a class="hover:text-slate-900 dark:hover:text-white" href="https://github.com/{{ site.github_username }}">GitHub</a>
        {% endif %}
        {% if site.twitter_username %}
        <a class="hover:text-slate-900 dark:hover:text-white" href="https://twitter.com/{{ site.twitter_username }}">Twitter/X</a>
        {% endif %}
        {% if site.bluesky_username %}
        <a class="hover:text-slate-900 dark:hover:text-white" href="https://bsky.app/profile/{{ site.bluesky_username }}">Bluesky</a>
        {% endif %}
        {% if site.linkedin_username %}
        <a class="hover:text-slate-900 dark:hover:text-white" href="https://www.linkedin.com/in/{{ site.linkedin_username }}">LinkedIn</a>
        {% endif %}
      </div>
    </div>
  </div>
</footer>

<script>
  // Dark mode toggle
  const toggle = document.getElementById("themeToggle");
  const root = document.documentElement;

  // Initialize theme
  const saved = localStorage.getItem("theme");
  if (saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
    root.classList.add("dark");
  }

  toggle?.addEventListener("click", () => {
    root.classList.toggle("dark");
    localStorage.setItem("theme", root.classList.contains("dark") ? "dark" : "light");
  });

  // Mobile menu toggle
  const mobileMenuToggle = document.getElementById("mobileMenuToggle");
  const mobileMenu = document.getElementById("mobileMenu");

  mobileMenuToggle?.addEventListener("click", () => {
    const isHidden = mobileMenu.classList.contains("hidden");
    if (isHidden) {
      mobileMenu.classList.remove("hidden");
      mobileMenuToggle.setAttribute("aria-expanded", "true");
    } else {
      mobileMenu.classList.add("hidden");
      mobileMenuToggle.setAttribute("aria-expanded", "false");
    }
  });

  // Update year
  document.getElementById("year").textContent = new Date().getFullYear();
</script>
