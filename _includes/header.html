<header class="sticky top-0 z-50">
  <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
    <div class="mt-4 rounded-2xl border border-white/30 dark:border-white/10 bg-white/70 dark:bg-slate-950/60 backdrop-blur shadow-sm">
      <div class="flex items-center justify-between px-4 sm:px-6 py-3">
        <a href="{{ site.baseurl }}/" class="flex items-center gap-3">
          <span class="inline-flex h-9 w-9 items-center justify-center rounded-xl
                       bg-gradient-to-br from-fuchsia-500 via-cyan-400 to-amber-300 text-white shadow">
            <span class="font-extrabold">S</span>
          </span>
          <span class="font-extrabold tracking-tight text-lg">Sunix</span>
          <span class="hidden sm:inline text-xs font-medium text-slate-600 dark:text-slate-400">
            {{ site.tagline }}
          </span>
        </a>

        <nav class="hidden md:flex items-center gap-6 text-sm font-semibold text-slate-700 dark:text-slate-300">
          <a class="hover:text-slate-900 dark:hover:text-white" href="{{ site.baseurl }}/">Home</a>
          {% for page in site.pages %}
          {% if page.title %}
          <a class="hover:text-slate-900 dark:hover:text-white" href="{{ page.url | prepend: site.baseurl }}">{{ page.title }}</a>
          {% endif %}
          {% endfor %}
        </nav>

        <div class="flex items-center gap-2">
          <a
            href="{{ "/feed.xml" | prepend: site.baseurl }}"
            class="hidden sm:inline-flex items-center gap-2 rounded-xl px-3 py-2 text-sm font-semibold
                   bg-slate-900 text-white dark:bg-white dark:text-slate-900 hover:opacity-90 transition"
          >
            RSS
            <span class="inline-flex h-1.5 w-1.5 rounded-full bg-amber-300"></span>
          </a>

          <button
            id="themeToggle"
            class="inline-flex items-center justify-center rounded-xl border border-slate-200 dark:border-white/10
                   bg-white/80 dark:bg-white/5 px-3 py-2 text-sm font-semibold hover:bg-white transition"
            aria-label="Toggle dark mode"
            type="button"
          >
            <span class="dark:hidden">🌙</span>
            <span class="hidden dark:inline">☀️</span>
          </button>

          <button class="md:hidden inline-flex items-center justify-center rounded-xl px-3 py-2 border border-slate-200 dark:border-white/10 bg-white/80 dark:bg-white/5">
            ☰
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
